/* ---------- spoken numbers + speech parsing (pure functions, no DOM) ---------- */
const SP_ONES = { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19 };
const SP_TENS = { twenty:20, thirty:30, forty:40, fourty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90 };
const SP_SCALE = { hundred:100, thousand:1000, million:1000000 };
const SP_UNITS = { pack:"pack", packs:"pack", packet:"pack", packets:"pack", bag:"bag", bags:"bag", bottle:"bottle", bottles:"bottle",
  crate:"crate", crates:"crate", carton:"carton", cartons:"carton", piece:"piece", pieces:"piece", pcs:"piece", pc:"piece",
  dozen:"dozen", dozens:"dozen", sachet:"sachet", sachets:"sachet", bundle:"bundle", bundles:"bundle", bucket:"bucket", buckets:"bucket",
  gallon:"gallon", gallons:"gallon", sack:"sack", sacks:"sack", tray:"tray", trays:"tray", plate:"plate", plates:"plate",
  pair:"pair", pairs:"pair", yard:"yard", yards:"yard", roll:"roll", rolls:"roll", kg:"kg", kilo:"kg", kilos:"kg",
  litre:"litre", litres:"litre", liter:"litre", liters:"litre", cup:"cup", cups:"cup", tin:"tin", tins:"tin" };
const SP_STOP = new Set(["sold","sell","selling","sale","sales","i","we","a","an","the","of","my","some","please","record","add","just",
  "only","bought","buy","got","have","has","had","with","another","more","about","around","to","from","that","is","are","was","were","it","today","yesterday"]);
const SP_PRICEWORDS = new Set(["at","per","each","apiece","for","total","worth","cost","costs","price","priced","naira","x"]);
const SP_SEP = new Set([",", ";", "then", "plus", "also", "and"]);

function spNormalize(text) {
  let s = String(text || "").toLowerCase();
  s = s.replace(/₦/g, " ");
  s = s.replace(/\b(naira|ngn)\b/g, " naira ");
  s = s.replace(/(\d),(?=\d{3}(\D|$))/g, "$1");                     // 1,500 -> 1500
  s = s.replace(/\bn(?=\d)/g, " ");                                  // N500 -> 500
  s = s.replace(/(\d+(?:\.\d+)?)\s*k\b/g, (m, n) => String(Math.round(parseFloat(n) * 1000))); // 2k, 2.5k
  s = s.replace(/@/g, " at ");
  s = s.replace(/(\d)\s*x\b/g, "$1 ");                               // 3x pure water -> 3 pure water
  s = s.replace(/\bx\s*(?=\d)/g, " x ");                             // x3 -> x 3
  s = s.replace(/-/g, " ");
  return s;
}
function spTokens(s) { return s.match(/\d+(?:\.\d+)?|[a-z]+(?:'[a-z]+)?|[,;]/g) || []; }

// Reads a number (digits or words) starting at tokens[i]. Returns { value, next } or null.
function spReadNumber(tokens, i) {
  let j = i, total = 0, cur = 0, any = false, last = null;
  while (j < tokens.length) {
    const t = tokens[j];
    if (/^\d/.test(t)) {
      if (any) break;
      cur = parseFloat(t); any = true; last = "digit"; j++;
    } else if (Object.prototype.hasOwnProperty.call(SP_ONES, t)) {
      const v = SP_ONES[t];
      if (!any) { cur = v; any = true; last = "ones"; j++; }
      else if (last === "scale" || last === "and") { cur += v; last = "ones"; j++; }
      else if (last === "tens" && v > 0 && v < 10) { cur += v; last = "ones"; j++; }
      else break;
    } else if (Object.prototype.hasOwnProperty.call(SP_TENS, t)) {
      const v = SP_TENS[t];
      if (!any) { cur = v; any = true; last = "tens"; j++; }
      else if (last === "scale" || last === "and") { cur += v; last = "tens"; j++; }
      else break;
    } else if (Object.prototype.hasOwnProperty.call(SP_SCALE, t)) {
      const mult = SP_SCALE[t];
      if (!any) { cur = 1; any = true; }
      else if (last === "scale" && cur === 0) break;
      if (mult === 100) cur = (cur || 1) * 100;
      else { total += (cur || 1) * mult; cur = 0; }
      last = "scale"; j++;
    } else if (t === "and" && any && last === "scale" && j + 1 < tokens.length &&
               (Object.prototype.hasOwnProperty.call(SP_ONES, tokens[j + 1]) || Object.prototype.hasOwnProperty.call(SP_TENS, tokens[j + 1]))) {
      last = "and"; j++;
    } else break;
  }
  return any ? { value: total + cur, next: j } : null;
}

function spAnnotate(tokens) {
  const out = [];
  for (let i = 0; i < tokens.length;) {
    const r = spReadNumber(tokens, i);
    if (r) { out.push({ type: "num", value: r.value }); i = r.next; }
    else { out.push({ type: "word", w: tokens[i] }); i++; }
  }
  return out;
}

// Largest-first is wrong for "two thousand five hundred" (one span), so: first number said.
function parseSpokenAmount(text) {
  const ann = spAnnotate(spTokens(spNormalize(text)));
  const n = ann.find((a) => a.type === "num");
  return n ? n.value : null;
}

/* ---------- sales speech: "3 packs of pure water at 700 and 2 ice block" ---------- */
function spStem(w) {
  w = String(w).replace(/[^a-z0-9]/g, "");
  if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
  if (w.length > 3 && w.endsWith("s") && !w.endsWith("ss")) return w.slice(0, -1);
  return w;
}
function spLev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, k) => k);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function spMatchProduct(nameWords, products) {
  if (!nameWords.length || !products || !products.length) return null;
  const spoken = nameWords.map(spStem).filter(Boolean);
  if (!spoken.length) return null;
  const joined = spoken.join("");
  const scored = [];
  for (const p of products) {
    const ptoks = String(p.name).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean).map(spStem);
    const pj = ptoks.join("");
    let score = 0;
    if (joined === pj) score = 1;
    else {
      const common = spoken.filter((t) => ptoks.some((u) => u === t || (t.length >= 5 && spLev(t, u) <= 1))).length;
      if (common > 0) {
        const contSpoken = common / spoken.length, contProd = common / ptoks.length;
        score = contSpoken * 0.85 * (contProd >= 0.5 || contSpoken === 1 ? 1 : 0.6);
      }
      if (pj.length >= 4 && spLev(joined, pj) <= Math.max(1, Math.floor(pj.length * 0.2))) score = Math.max(score, 0.9);
    }
    if (score > 0) scored.push({ p, score });
  }
  scored.sort((a, b) => b.score - a.score);
  if (!scored.length || scored[0].score < 0.6) return null;
  if (scored.length > 1 && scored[0].score < 1 && Math.abs(scored[0].score - scored[1].score) < 0.01) return null; // ambiguous
  return scored[0].p;
}

function spNumKind(seg, k) {
  const prev = seg[k - 1] && seg[k - 1].type === "word" ? seg[k - 1].w : null;
  const next = seg[k + 1] && seg[k + 1].type === "word" ? seg[k + 1].w : null;
  if (prev === "at" || prev === "per" || next === "each" || next === "apiece") return "unit";
  if (prev === "for" || prev === "total" || prev === "worth" || prev === "cost" || prev === "costs" || prev === "price" || prev === "priced") return "total";
  if (prev === "x") return "qty";
  return "bare";
}
function spIsNameWord(a) {
  return a.type === "word" && !SP_UNITS[a.w] && !SP_STOP.has(a.w) && !SP_PRICEWORDS.has(a.w);
}
// "3 pure water 2 ice block" (no "and") -> two segments
function spSplitBare(seg) {
  const bare = [];
  seg.forEach((a, k) => { if (a.type === "num" && spNumKind(seg, k) === "bare") bare.push(k); });
  if (bare.length < 2) return [seg];
  const firstSig = seg.find((a) => a.type === "num" || spIsNameWord(a));
  const qtyFirst = firstSig && firstSig.type === "num";
  const cuts = [];
  if (qtyFirst) {
    for (const k of bare.slice(1)) {
      const nameBefore = seg.slice(0, k).some(spIsNameWord);
      const nameAfter = seg.slice(k + 1).some(spIsNameWord);
      if (nameBefore && nameAfter) cuts.push(k);
    }
  } else {
    for (const k of bare.slice(0, -1)) if (seg.slice(k + 1).some(spIsNameWord)) cuts.push(k + 1);
  }
  if (!cuts.length) return [seg];
  const out = []; let from = 0;
  for (const c of cuts) { out.push(seg.slice(from, c)); from = c; }
  out.push(seg.slice(from));
  return out.filter((s) => s.length);
}

function spTitle(words) { return words.map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" "); }

function spParseSegment(seg, products) {
  const nums = []; const nameWords = []; let unit = null;
  seg.forEach((a, k) => {
    if (a.type === "num") {
      const next = seg[k + 1] && seg[k + 1].type === "word" ? seg[k + 1].w : null;
      nums.push({ value: a.value, kind: spNumKind(seg, k), naira: next === "naira" });
    } else if (SP_UNITS[a.w]) { if (!unit) unit = SP_UNITS[a.w]; }
    else if (!SP_STOP.has(a.w) && !SP_PRICEWORDS.has(a.w)) nameWords.push(a.w);
  });
  if (!nameWords.length) return null;
  const product = spMatchProduct(nameWords, products);
  const priceKnown = product && Number(product.price) > 0 ? Number(product.price) : null;

  let qty = null, money = null, moneyKind = null;
  const explicitQty = nums.find((n) => n.kind === "qty");
  const unitNum = nums.find((n) => n.kind === "unit");
  const totalNum = nums.find((n) => n.kind === "total");
  const bares = nums.filter((n) => n.kind === "bare");
  if (explicitQty) qty = explicitQty.value;
  if (unitNum) { money = unitNum.value; moneyKind = "unit"; }
  else if (totalNum) { money = totalNum.value; moneyKind = "total"; }

  const freeBares = bares.slice();
  if (qty === null) {
    const qIdx = freeBares.findIndex((n) => !n.naira);
    if (qIdx >= 0 && (freeBares.length > 1 || money !== null)) { qty = freeBares[qIdx].value; freeBares.splice(qIdx, 1); }
  }
  if (money === null && freeBares.length) {
    // a second bare number (or a number followed by "naira") is money
    const m = freeBares.find((n) => n.naira) || freeBares[freeBares.length - 1];
    if (qty !== null || m.naira || freeBares.length > 1) { money = m.value; moneyKind = "bare"; freeBares.splice(freeBares.indexOf(m), 1); }
  }
  // exactly one lone number, no markers: decide whether it's a quantity or an amount
  if (qty === null && money === null && freeBares.length === 1) {
    const n = freeBares[0].value;
    if (priceKnown) {
      if (n === priceKnown) { qty = 1; }
      else if (n <= 200) { qty = n; }
      else if (n % priceKnown === 0) { qty = n / priceKnown; }
      else { qty = 1; money = n; moneyKind = "unit"; }
    } else if (n <= 100) { qty = n; }
    else { qty = 1; money = n; moneyKind = "unit"; }
  }
  if (qty === null || qty <= 0) qty = 1;

  let unitPrice = priceKnown;
  if (money !== null) {
    if (moneyKind === "unit") unitPrice = money;
    else if (moneyKind === "total") unitPrice = qty > 1 ? money / qty : money;
    else { // bare: unit or total? use the product's price as a guide
      if (priceKnown && qty > 1 && Math.abs(money - priceKnown * qty) < Math.abs(money - priceKnown)) unitPrice = money / qty;
      else unitPrice = money;
    }
  }
  if (unitPrice !== null) unitPrice = Math.round(unitPrice * 100) / 100;
  return {
    name: product ? product.name : spTitle(nameWords),
    productId: product ? product.id : null,
    isNew: !product,
    qty, unit: product ? (product.unit || unit) : unit,
    unitPrice: unitPrice && unitPrice > 0 ? unitPrice : null,
  };
}

function parseSalesSpeech(text, products) {
  const ann = spAnnotate(spTokens(spNormalize(text)));
  const segs = [[]];
  for (const a of ann) {
    if (a.type === "word" && SP_SEP.has(a.w)) { if (segs[segs.length - 1].length) segs.push([]); continue; }
    segs[segs.length - 1].push(a);
  }
  const items = [];
  for (const seg of segs.filter((s) => s.length)) {
    for (const sub of spSplitBare(seg)) {
      const it = spParseSegment(sub, products || []);
      if (it) items.push(it);
    }
  }
  return { heard: String(text || "").trim(), items };
}

/* ---------- "I owe" speech: "I owe Mama Ade 15000 for fish", "I paid Chidi 5k" ---------- */
const OWE_NOISE = new Set(["i","we","owe","owes","owing","borrowed","borrow","from","to","paid","pay","gave","give","sent","send","settled",
  "collected","took","take","credit","bought","buy","got","the","a","an","naira","please","money","some","still","today","just","am","have","has","had","me","my"]);
function parseOweSpeech(text, knownNames) {
  const norm = spNormalize(text);
  const toks = spTokens(norm);
  const ann = spAnnotate(toks);
  const nums = ann.filter((a) => a.type === "num");
  if (!nums.length) return { intent: "owe", name: "", amount: null, item: "", heard: String(text || "").trim() };
  const amountSpan = nums.reduce((best, n) => (n.value > best.value ? n : best), nums[0]);
  const intent = /\b(paid|pay|gave|give|sent|send|settled|settle|cleared)\b/.test(norm) && !/\b(owe|owes|borrowed|credit|collected|took)\b/.test(norm) ? "pay" : "owe";
  // item: whatever follows for/on/being
  let item = "";
  const m = norm.match(/\b(?:for|on|being)\b\s+(.+)$/);
  if (m) item = m[1].replace(/\b(naira)\b/g, " ").replace(/\s+/g, " ").trim();
  // name: words before the amount, minus noise
  const idx = ann.indexOf(amountSpan);
  const nameCand = [];
  for (let k = 0; k < idx; k++) {
    const a = ann[k];
    if (a.type === "word" && !OWE_NOISE.has(a.w) && !SP_PRICEWORDS.has(a.w) && !SP_SEP.has(a.w) && !SP_STOP.has(a.w)) nameCand.push(a.w);
  }
  let nameWords = nameCand;
  if (!nameWords.length) {
    // "15000 to Mama Ade": look after the amount, up to for/on
    for (let k = idx + 1; k < ann.length; k++) {
      const a = ann[k];
      if (a.type === "word" && (a.w === "for" || a.w === "on" || a.w === "being")) break;
      if (a.type === "word" && !OWE_NOISE.has(a.w) && !SP_PRICEWORDS.has(a.w) && !SP_STOP.has(a.w)) nameWords.push(a.w);
    }
  }
  let name = spTitle(nameWords.slice(0, 3));
  // reuse an existing person if the name is close enough
  if (name && knownNames && knownNames.length) {
    const low = name.toLowerCase();
    const hit = knownNames.find((n) => n.toLowerCase() === low) ||
      knownNames.find((n) => spLev(n.toLowerCase(), low) <= Math.max(1, Math.floor(low.length * 0.25))) ||
      knownNames.find((n) => n.toLowerCase().startsWith(low) || low.startsWith(n.toLowerCase()));
    if (hit) name = hit;
  }
  return { intent, name, amount: amountSpan.value, item, heard: String(text || "").trim() };
}

function bzBarChart(vals, labels) {
  const W = 340, H = 156, pl = 4, pr = 4, pt = 18, pb = 22, n = vals.length, max = Math.max(1, ...vals);
  const bw = (W - pl - pr) / n, gap = Math.min(8, bw * 0.28);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales per day">`;
  s += `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>`;
  vals.forEach((v, i) => {
    const h = Math.round((H - pt - pb) * v / max), x = pl + i * bw + gap / 2, y = H - pb - h, w = bw - gap, last = i === n - 1;
    s += `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${Math.max(h, v > 0 ? 2 : 0)}" rx="3" fill="${last ? "var(--accent)" : "var(--primary)"}"/>`;
    if (n <= 7 && v > 0) s += `<text x="${(x + w / 2).toFixed(1)}" y="${y - 4}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--ink-soft)">${bzShort(v)}</text>`;
    if (labels[i]) s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${labels[i]}</text>`;
  });
  return s + "</svg>";
}

function bzDownload(name, text, type) {

/* =====================================================================
   AUTOMATIC SYNC  (phone <-> server). Local data stays the source of truth
   so it works offline; changes are pushed as small documents and other
   phones pick them up within seconds by polling a tiny "rev" counter.
   ===================================================================== */
const bzQK = () => "mytab_biz_q_" + (getBusinessId() || "local");
const bzCK = () => "mytab_biz_cur_" + (getBusinessId() || "local");
const bzIK = () => "mytab_biz_init_" + (getBusinessId() || "local");
function bzQ() { try { return JSON.parse(localStorage.getItem(bzQK())) || {}; } catch (e) { return {}; } }
function bzQSave(q) { try { localStorage.setItem(bzQK(), JSON.stringify(q)); } catch (e) {} }
function bzQueueLen() { return Object.keys(bzQ()).length; }
function bzMark(kind, id, deleted) {
  const q = bzQ(); q[kind + ":" + id] = { kind, id, deleted: !!deleted }; bzQSave(q);
  updateSyncIndicator(); setTimeout(() => bzTick(true), 50);
}
function bzMarkAllQuiet() {
  const b = bizData(), q = bzQ();
  b.products.forEach((x) => { q["product:" + x.id] = { kind: "product", id: x.id, deleted: false }; });
  b.sales.forEach((x) => { q["sale:" + x.id] = { kind: "sale", id: x.id, deleted: false }; });
  b.creditors.forEach((c) => {
    q["creditor:" + c.id] = { kind: "creditor", id: c.id, deleted: false };
    c.entries.forEach((e) => { q["oweentry:" + e.id] = { kind: "oweentry", id: e.id, deleted: false }; });
  });
  bzQSave(q);
}
function bzMarkAll() { bzMarkAllQuiet(); setTimeout(() => bzTick(true), 50); }
function bzDocFor(m) {
  const b = bizData();
  if (m.deleted) return { id: m.id, kind: m.kind, data: {}, deleted: true };
  if (m.kind === "product") { const x = b.products.find((p) => p.id === m.id); return x ? { id: x.id, kind: "product", data: { name: x.name, unit: x.unit, price: x.price } } : null; }
  if (m.kind === "sale") { const x = b.sales.find((p) => p.id === m.id); return x ? { id: x.id, kind: "sale", data: { ts: x.ts, date: x.date, items: x.items, total: x.total, paid: x.paid, customerId: x.customerId, customerName: x.customerName } } : null; }
  if (m.kind === "creditor") { const x = b.creditors.find((p) => p.id === m.id); return x ? { id: x.id, kind: "creditor", data: { name: x.name, phone: x.phone } } : null; }
  if (m.kind === "oweentry") {
    for (const c of b.creditors) { const e = c.entries.find((p) => p.id === m.id); if (e) return { id: e.id, kind: "oweentry", data: { creditorId: c.id, kind: e.kind, amount: e.amount, item: e.item, date: e.date } }; }
  }
  return null;
}
const BZ_RANK = { creditor: 0, product: 1, oweentry: 2, sale: 3 };
let bzBusy = false, bzLastRev = null, bzSyncMissing = false, bzRenderTimer = null;

async function bzFlush() {
  // first sync on this phone: upload whatever was already saved here before sync existed
  if (!localStorage.getItem(bzIK())) { bzMarkAllQuiet(); try { localStorage.setItem(bzIK(), "1"); } catch (e) {} }
  const items = Object.values(bzQ()).sort((a, c) => BZ_RANK[a.kind] - BZ_RANK[c.kind]);
  while (items.length) {
    const chunk = items.splice(0, 200), docs = chunk.map(bzDocFor).filter(Boolean);
    if (docs.length) {
      const r = await apiFetch("/api/sync/docs", { method: "POST", body: JSON.stringify({ docs }) });
      if (!r.ok) { if (r.status === 404) bzSyncMissing = true; return false; }
    }
    const cur = bzQ();
    chunk.forEach((m) => { if (JSON.stringify(cur[m.kind + ":" + m.id]) === JSON.stringify(m)) delete cur[m.kind + ":" + m.id]; });
    bzQSave(cur);
  }
  updateSyncIndicator();
  return true;
}

async function bzPull() {
  let changed = false, since = Number(localStorage.getItem(bzCK())) || 0;
  for (let guard = 0; guard < 20; guard++) {
    const r = await apiFetch("/api/sync/docs?since=" + since, { method: "GET" });
    if (!r.ok) { if (r.status === 404) bzSyncMissing = true; return changed; }
    const b = bizData(), q = bzQ(), docs = r.data.docs || [];
    docs.sort((a, c) => BZ_RANK[a.kind] - BZ_RANK[c.kind] || a.seq - c.seq);
    for (const d of docs) {
      if (q[d.kind + ":" + d.id]) continue; // our newer local change is still waiting to go up
      const x = d.data || {};
      if (d.kind === "product") {
        const i = b.products.findIndex((p) => p.id === d.id);
        if (d.deleted) { if (i >= 0) { b.products.splice(i, 1); changed = true; } }
        else {
          const np = { id: d.id, name: x.name, unit: x.unit, price: x.price };
          if (i >= 0) { if (JSON.stringify(b.products[i]) !== JSON.stringify(np)) { b.products[i] = np; changed = true; } }
          else { b.products.push(np); changed = true; }
        }
      } else if (d.kind === "sale") {
        const i = b.sales.findIndex((p) => p.id === d.id);
        if (d.deleted) { if (i >= 0) { b.sales.splice(i, 1); changed = true; } }
        else {
          const ns = Object.assign({ id: d.id }, x);
          if (i >= 0) { if (JSON.stringify(b.sales[i]) !== JSON.stringify(ns)) { b.sales[i] = ns; changed = true; } }
          else { b.sales.push(ns); changed = true; }
        }
      } else if (d.kind === "creditor") {
        const i = b.creditors.findIndex((p) => p.id === d.id);
        if (d.deleted) { if (i >= 0) { b.creditors.splice(i, 1); changed = true; } }
        else if (i >= 0) {
          if (b.creditors[i].name !== x.name || b.creditors[i].phone !== (x.phone || "")) { b.creditors[i].name = x.name; b.creditors[i].phone = x.phone || ""; changed = true; }
        } else { b.creditors.push({ id: d.id, name: x.name, phone: x.phone || "", entries: [] }); changed = true; }
      } else if (d.kind === "oweentry") {
        for (const c of b.creditors) {
          const j = c.entries.findIndex((e) => e.id === d.id);
          if (j >= 0 && (d.deleted || c.id !== x.creditorId)) { c.entries.splice(j, 1); changed = true; }
        }
        if (!d.deleted) {
          let c = b.creditors.find((p) => p.id === x.creditorId);
          if (!c) { c = { id: x.creditorId, name: "(unknown)", phone: "", entries: [] }; b.creditors.push(c); changed = true; }
          const ne = { id: d.id, kind: x.kind, amount: x.amount, item: x.item || "", date: x.date };
          const j = c.entries.findIndex((e) => e.id === d.id);
          if (j >= 0) { if (JSON.stringify(c.entries[j]) !== JSON.stringify(ne)) { c.entries[j] = ne; changed = true; } }
          else { c.entries.push(ne); changed = true; }
        }
      }
    }
    since = r.data.maxSeq || since;
    try { localStorage.setItem(bzCK(), String(since)); } catch (e) {}
    if (docs.length) bizSave();
    if (!r.data.more) break;
  }
  return changed;
}

function bzRenderSoon() {
  clearTimeout(bzRenderTimer);
  const go = () => {
    const a = document.activeElement;
    if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) { bzRenderTimer = setTimeout(go, 1500); return; } // never yank the keyboard away mid-typing
    render();
  };
  go();
}

async function bzTick(force) {
  if (bzBusy || !getToken() || !navigator.onLine || stage !== "app" || document.visibilityState !== "visible") return;
  if (bzSyncMissing && force !== true) return;
  bzBusy = true;
  try {
    await bzFlush();
    const r = await apiFetch("/api/sync/rev", { method: "GET" });
    if (!r.ok) { if (r.status === 404) bzSyncMissing = true; if (r.status === 401) handleAuthExpired(); return; }
    bzSyncMissing = false;
    if (r.data.rev !== bzLastRev) {
      let changed = await bzPull();
      if (!bzIsStaff() && await bzLoadStats()) changed = true;
      if (loadQueue().length === 0) {
        const c0 = enqueueCount;
        const { debtors: p, error } = await fetchCustomers();
        if (enqueueCount !== c0 || loadQueue().length > 0) { bzLastRev = null; return; } // something was added while this downloaded: the list is stale, try again next tick
        if (!error && JSON.stringify(p) !== JSON.stringify(debtors)) { debtors = p; saveDebtors(); changed = true; }
      }
      bzLastRev = r.data.rev;
      if (changed) bzRenderSoon();
    }
  } catch (e) { /* offline or server waking up: the next tick tries again */ }
  finally { bzBusy = false; }
}
setInterval(bzTick, 5000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { bzLastRev = null; bzTick(true); } });
window.addEventListener("online", () => { bzLastRev = null; bzTick(true); });
setTimeout(() => bzTick(true), 800);

// sync right away whenever the app screen opens (after login, unlock or reload), not on the next timer
let bzArmed = false;
function bzAutoStart() {
  if (stage === "app") { if (!bzArmed) { bzArmed = true; bzLastRev = null; setTimeout(() => bzTick(true), 150); } }
  else bzArmed = false;
}

      <button class="iconbtn" data-b="smBack">${icon.back}</button>
      <div class="topbar-title">Your attendants</div>
      <div style="width:36px"></div>
    </div>
    <div class="biz-body">
      <div class="biz-dim" style="font-size:13.5px;">An attendant signs in on their own phone and can record sales and take payments from customers. They <b style="color:var(--ink)">cannot</b> delete anything, see your totals, or see what you owe.</div>
      ${last}
      ${list ? `<div class="quickadd-label" style="margin-top:16px;">Signed up</div>${list}` : (smList ? `<div class="biz-eg" style="text-align:left;margin-top:14px;">No attendants yet.</div>` : "")}
      ${canAdd ? `<div class="biz-card">
        <div class="biz-h">Add an attendant</div>
        <div class="stage-form" style="margin:0;gap:10px;">
          <label>Name<input data-b="smName" data-ev="input" placeholder="e.g. Tola" value="${esc(smName)}" /></label>
          <label>Their 4-digit code <span class="optional">(you choose it, they use it to sign in)</span><input data-b="smCode" data-ev="input" type="tel" inputmode="numeric" maxlength="4" placeholder="e.g. 7391" value="${esc(smCode)}" /></label>
          ${smError ? `<div class="stage-error">${esc(smError)}</div>` : ""}
          <button class="settle-btn" data-b="smAdd" ${smBusy ? "disabled" : ""}>${smBusy ? "Adding…" : "Add attendant"}</button>
        </div></div>`
      : `<div class="biz-card"><div class="biz-h">Attendants come with MyTab Pro</div><div class="biz-dim" style="margin-bottom:10px;">Let your workers record sales without seeing your money.</div><button class="settle-btn" data-b="goPro" style="width:100%;">See Pro</button></div>`}
      <div class="quickadd-label" style="margin-top:18px;">Customer phone numbers</div>
      <div class="biz-dim" style="margin-top:4px;">Should attendants see your customers' phone numbers?</div>
      <div class="biz-pay" style="margin-top:8px;"><button class="chip${smShowPhones ? "" : " chip--active"}" data-b="smPhones" data-v="0">Hidden</button><button class="chip${smShowPhones ? " chip--active" : ""}" data-b="smPhones" data-v="1">Can see</button></div>
    </div>
  </div>`;
}
Object.assign(BZ, {
  slOpen: () => { slError = ""; slId = ""; slCode = ""; stage = "staffLogin"; render(); },
  slBack: () => { stage = "login"; render(); },
  slId: (el) => { slId = el.value; }, slCode: (el) => { slCode = el.value.replace(/\D/g, "").slice(0, 4); },
  slGo: async () => {
    slError = "";
    const idn = classifyIdentifier(slId);
    if (!idn) { slError = "Enter the shop's phone number."; render(); return; }
    if (!/^\d{4}$/.test(slCode)) { slError = "Your code is 4 numbers."; render(); return; }
    if (!navigator.onLine) { slError = "You need internet to sign in the first time."; render(); return; }
    slBusy = true; render();
    const r = await apiFetch("/auth/staff-login", { method: "POST", body: JSON.stringify({ identifier: idn.value, code: slCode }) });
    slBusy = false;
    if (!r.ok) { slError = r.error || "Couldn't sign in, try again."; render(); return; }
    const { token, business, staff, showPhones } = r.data;
    setToken(token); BUSINESS_ID = business.id; setBusinessId(BUSINESS_ID);
    setBusinessMeta({ name: business.name, identifier: idn.value, type: business.business_type || "", pin: "" });
    bzSet(BZ_ROLE_KEY, "staff"); bzSet(BZ_SNAME_KEY, staff.name);
    markOnboarded(); _biz = null; _bizKey = null; bzLastRev = null;
    const { debtors: pulled } = await fetchCustomers();
    debtors = pulled || []; saveDebtors();
    stage = "app"; view = "sales"; slCode = "";
    render();
  },
  staffBack: () => { view = "sales"; render(); },
  staffOut: () => { if (confirm("Sign out of MyTab on this phone?")) handleLogout(); },
  /* owner side */
  smOpen: () => { smError = ""; smLast = null; smEditId = null; view = "staffmgr"; render(); bzLoadStaff(); },
  smBack: () => { goSettings(); },
  smName: (el) => { smName = el.value; }, smCode: (el) => { smCode = el.value.replace(/\D/g, "").slice(0, 4); },
  smAdd: async () => {
    smError = "";
    if (!smName.trim()) { smError = "Enter the attendant's name."; render(); return; }
    if (!/^\d{4}$/.test(smCode)) { smError = "The code must be 4 numbers."; render(); return; }
    smBusy = true; render();
    const r = await apiFetch("/api/staff", { method: "POST", body: JSON.stringify({ name: smName.trim(), code: smCode }) });
    smBusy = false;
    if (!r.ok) { smError = r.status === 402 ? "Attendants need MyTab Pro." : (r.error || "Couldn't add. Try again."); render(); return; }
    smLast = { name: smName.trim(), code: smCode }; smName = ""; smCode = "";
    await bzLoadStaff(); render();
  },
  smSend: () => {
    if (!smLast) return;
    const meta = getBusinessMeta();
    const url = new URL("./", location.href).href;
    const msg = "Hi " + smLast.name + ", you can now record sales for " + (meta.name || "the shop") + " on MyTab.\n1. Open " + url + "\n2. Tap Get started, then 'I work in a shop (attendant)'\n3. Shop phone number: " + (meta.identifier || "") + "\n4. Your code: " + smLast.code;
    window.location.href = "https://wa.me/?text=" + encodeURIComponent(msg);
  },
  smEdit: (el) => { smEditId = smEditId === el.dataset.id ? null : el.dataset.id; smEditCode = ""; render(); },
  smEditCode: (el) => { smEditCode = el.value.replace(/\D/g, "").slice(0, 4); },
  smEditSave: async () => {
    if (!/^\d{4}$/.test(smEditCode)) { flash("The code must be 4 numbers."); return; }
    const r = await apiFetch("/api/staff/" + smEditId, { method: "PATCH", body: JSON.stringify({ code: smEditCode }) });
    if (!r.ok) { flash(r.error || "Couldn't change the code."); return; }
    smEditId = null; smEditCode = ""; flash("New code saved"); render();
  },
  smDel: async (el) => {
    const s = (smList || []).find((x) => x.id === el.dataset.id); if (!s) return;
    if (!confirm("Remove " + s.name + "? They will be signed out and can't record sales any more.")) return;
    const r = await apiFetch("/api/staff/" + s.id, { method: "DELETE" });
    if (!r.ok) { flash(r.error || "Couldn't remove. Try again."); return; }
    smLast = null; await bzLoadStaff(); flash(s.name + " removed"); render();
  },
  smPhones: async (el) => {
    const show = el.dataset.v === "1";
    const r = await apiFetch("/api/staff/settings", { method: "POST", body: JSON.stringify({ showPhones: show }) });
    if (!r.ok) { flash("Couldn't save. Check your network."); return; }
    smShowPhones = show; render();
  },
});

    render();
    refreshFromServerIfIdle();
    fetchBillingStatus();
  </script>
</body>
</html>
